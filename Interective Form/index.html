<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mystyle.css">
    <title>Intereactive Form</title>
</head>
<body>
    <header>
        <div id="title-contaner">
            <h1>Interactive Form</h1>
        </div>
    </header>
    <main> 
        <div id="contaniner">

            <div class="input-gruop">
            <input type="text" id="inputName" placeholder="Enter your name" >
            </div>

            <div class="input-gruop">
            <input type="text" id="inputEmail" placeholder="Enter your email" >
            </div>
            
            <div class="input-gruop">
            <input type="text" id="inputPhone" placeholder="Enter your number phone" >
            </div>
        
        <button id="submitBtn">Register</button>
        <small id="taskError" class="alert-error"></small>
        </div>
    </main>

<section id="recordsSection" class="hidden">
    <h2>Saves Registers</h2>
    <ul id="taskList"></ul>
</section>
    <script src="script.js"></script>
    
</body>
</html>
